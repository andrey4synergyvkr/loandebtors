[project]
name = "loandebtors-email-channel"
version = "0.1.0"
description = "LoanDebtors: рендеринг и отправка email через провайдера"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=9.5",
    "aiosmtplib>=3.0",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.29",
    "opentelemetry-instrumentation-asyncpg>=0.50b0",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.50b0",
    "opentelemetry-sdk>=1.29",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "punq>=0.7",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "uvicorn[standard]>=0.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/email_channel"]
