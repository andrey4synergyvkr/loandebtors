[project]
name = "loandebtors-scheduler"
version = "0.1.0"
description = "LoanDebtors: планирование запуска кампаний"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=9.5",
    "alembic>=1.14",
    "apscheduler>=3.11,<4",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "opentelemetry-exporter-otlp-proto-grpc>=1.29",
    "opentelemetry-instrumentation-asyncpg>=0.50b0",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.50b0",
    "opentelemetry-sdk>=1.29",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "punq>=0.7",
    "sqlalchemy[asyncio]>=2.0.36",
    "tzdata>=2025.1",
    "uvicorn[standard]>=0.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scheduler"]
